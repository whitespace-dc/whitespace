name: Auto-merge agent article PRs

# Agent article PRs (head branch agent/*) are build-checked and then squash-merged
# automatically, so new articles publish without manual review. Human PRs (any
# other branch prefix) are never touched — both jobs skip.
#
# Safety model:
#   - The agent-side W6 output-injection scan already gated content BEFORE the PR
#     was opened, so this is the SITE-INTEGRITY gate, not the content gate.
#   - `verify` must pass (same `npm run build` as deploy); a failing build leaves
#     the PR OPEN for manual review — merge never runs.
#   - pull_request (not _target): fork PRs get a read-only token, so an outside
#     PR cannot self-merge even if it spoofs an agent/ branch name.
#   - Gated on the agent/* branch prefix.
#
# Follow-ups (not blocking): restrict to PRs that only touch src/content/**;
# debounce the per-PR deploy dispatch when many PRs merge in one run.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build Astro site (merge gate)
        run: npm run build

  merge:
    needs: verify
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the agent PR (retry on merge-race)
        # When one agent run opens several PRs, they merge concurrently and a
        # losing PR sees "base branch was modified" -> `gh pr merge` exits 1.
        # The old single-shot step left that PR stranded OPEN with a red check,
        # because the workflow only re-triggers on opened/synchronize/reopened.
        # Retry a few times: once the racing merge lands, GitHub recomputes this
        # PR as mergeable again (content articles touch distinct paths -> no real
        # conflict) and the next attempt succeeds. A genuine conflict exhausts
        # the retries and leaves the PR OPEN for manual review, as before.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          merged() { [ "$(gh pr view "$PR" --repo "$REPO" --json state -q .state)" = "MERGED" ]; }
          for attempt in 1 2 3 4 5 6; do
            # Out-of-band merge (manual, or a prior attempt that merged but then
            # errored on branch-delete) -> already done; let deploy fire.
            if merged; then echo "PR #$PR already merged"; exit 0; fi
            if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
              echo "merged on attempt $attempt"
              exit 0
            fi
            # A non-zero exit can still mean the squash landed but --delete-branch
            # failed; re-check before treating it as a race to retry.
            if merged; then echo "PR #$PR merged (branch cleanup non-fatal)"; exit 0; fi
            echo "merge attempt $attempt failed (likely base moved under a concurrent agent PR); retrying in 15s"
            sleep 15
          done
          echo "::error::auto-merge failed after 6 attempts for PR #$PR — left open for manual review"
          exit 1
      - name: Trigger Pages deploy
        # A GITHUB_TOKEN merge does NOT fire the push-triggered deploy workflow
        # (loop guard), so dispatch it explicitly against the freshly-merged main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
